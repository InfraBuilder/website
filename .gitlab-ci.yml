stages:
  - build
  - deploy-prod

build:
  stage: build
  image:
    name: infrabuilder/kaniko:20260113-194026
    entrypoint: [""]
  script:
    - /usr/bin/executor 
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

deploy-prod:
  image: infrabuilder/kubectl:stable
  stage: deploy-prod
  before_script:
    - kubectl config set-credentials cicd --token=${K8S_TOKEN_PROD}
    - kubectl config set-cluster cluster --server=https://rancher.fr.blackswift.cloud/k8s/clusters/c-m-rfq27849
    - kubectl config set-context default --user=cicd --namespace=c-infrabuilder-default --cluster=cluster
    - kubectl config use-context default
  script:
    - kubectl set image deploy/infrabuilder-com site="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  when: manual
