stages:
  - build
  - deploy-prod

build_image:
  stage: build
  image: infrabuilder/kaniko-crane
  before_script:
    - crane auth login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image $CONTAINER_IMAGE with Kaniko..."
    - |
      if crane manifest $CONTAINER_IMAGE >/dev/null; then
        echo "Image already exists."
      else
        /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        echo "Image built and pushed to registry."
      fi

deploy-prod:
  image: infrabuilder/kubectl:stable
  stage: deploy-prod
  before_script:
    - kubectl config set-credentials cicd --token=${K8S_TOKEN_PROD}
    - kubectl config set-cluster cluster --server=https://rancher.prod.infrabuilder.net/k8s/clusters/c-m-tl8frrt9
    - kubectl config set-context default --user=cicd --namespace=prod-website --cluster=cluster
    - kubectl config use-context default
  script:
    - kubectl set image deploy/infrabuilder-com site="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  when: manual
