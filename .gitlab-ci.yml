stages:
  - build
  - deploy-prod

build:
  image: docker:latest
  stage: build
  services:
  - docker:dind  
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

deploy-prod:
  image: infrabuilder/kubectl:stable
  stage: deploy-prod
  before_script:
    - kubectl config set-credentials cicd --token=${K8S_TOKEN_PROD}
    - kubectl config set-cluster cluster --server=https://rancher.prod.infrabuilder.net/k8s/clusters/c-m-tl8frrt9
    - kubectl config set-context default --user=cicd --namespace=prod-website --cluster=cluster
    - kubectl config use-context default
  script:
    - kubectl set image deploy/infrabuilder-com site="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  when: manual
